<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: при открытии клавиатуры вьюпорт
         сжимается, и закреплённая внизу строка ввода в чате Лауры остаётся
         над клавиатурой, а не уезжает под неё. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>CIS.PR</title>
    <!-- Знак — navy-плашка с золотыми угловыми скобками (кадр, «взято в
         рамку»). Живёт в двух версиях, браузер берёт подходящую по размеру.
         16 и 32 — только рамка, без слова: на такой сетке «CIS.PR» занимает
         2–3 пикселя в высоту и превращается в грязь. Скобки там сделаны
         толще и длиннее (stroke 0.075 против 0.05, arm 0.22 против 0.19),
         иначе линия в один пиксель тонет в тёмном фоне.
         192 и 180 — рамка со словом внутри: на домашнем экране места хватает.
         apple-touch-icon сделан квадратным и непрозрачным: iOS накладывает
         свою маску, и прозрачные скруглённые углы стали бы чёрными. -->
    <!-- favicon.ico обязателен, даже когда есть PNG-ссылки ниже: браузеры
         (в первую очередь Safari) всё равно дёргают /favicon.ico по умолчанию,
         а SPA-фолбэк из public/_redirects отдавал на этот путь index.html со
         статусом 200. Браузер получал «успешный» ответ, который не картинка,
         и запоминал промах. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Шрифты «Маршрута» (Unbounded, Golos Text, IBM Plex Mono, EB Garamond)
         подключены локально через @fontsource — см. src/fonts.ts.
         Здесь остались только легаси-семейства ещё не мигрированных экранов
         (LAURA, LOCI, онбординг, авторизация): Playfair Display, Inter и
         Great Vibes для каллиграфической «L» бренда. Golos Text из этого
         запроса убран — он теперь локальный. Ссылка уходит вместе с
         миграцией остальных разделов, см. MIGRATION-TODO.md. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

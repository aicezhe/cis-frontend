<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: при открытии клавиатуры вьюпорт
         сжимается, и закреплённая внизу строка ввода в чате Лауры остаётся
         над клавиатурой, а не уезжает под неё. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>CIS.PR</title>
    <!-- Иконка живёт в двух версиях, браузер берёт подходящую по размеру.
         16 и 32 — упрощённый знак (каллиграфическая «L» на navy, как в
         таббаре): полная печать на вкладке сливалась в тёмное пятно, потому
         что кольцевая надпись и линии зданий там физически не помещаются.
         192 и 180 — полная печать с Дуомо, кампанилой и Баптистерием, на
         домашнем экране она читается целиком.
         PNG, а не SVG: в исходнике здания лежат встроенным растром на 2.5 МБ,
         так что векторное преимущество всё равно теряется, а вес — нет.
         apple-touch-icon сделан квадратным и непрозрачным: iOS накладывает
         свою маску, и прозрачные углы стали бы на домашнем экране чёрными. -->
    <!-- favicon.ico обязателен, даже когда есть PNG-ссылки ниже: браузеры
         (в первую очередь Safari) всё равно дёргают /favicon.ico по умолчанию,
         а SPA-фолбэк из public/_redirects отдавал на этот путь index.html со
         статусом 200. Браузер получал «успешный» ответ, который не картинка,
         и запоминал промах. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Шрифты «Маршрута» (Unbounded, Golos Text, IBM Plex Mono, EB Garamond)
         подключены локально через @fontsource — см. src/fonts.ts.
         Здесь остались только легаси-семейства ещё не мигрированных экранов
         (LAURA, LOCI, онбординг, авторизация): Playfair Display, Inter и
         Great Vibes для каллиграфической «L» бренда. Golos Text из этого
         запроса убран — он теперь локальный. Ссылка уходит вместе с
         миграцией остальных разделов, см. MIGRATION-TODO.md. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

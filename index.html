<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: при открытии клавиатуры вьюпорт
         сжимается, и закреплённая внизу строка ввода в чате Лауры остаётся
         над клавиатурой, а не уезжает под неё. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>CIS.PR</title>
    <!-- Фавиконка — печать CIS.PR с силуэтом Дуомо, кампанилы и Баптистерия.
         PNG, а не SVG: в исходнике здания лежат встроенным растром на 2.5 МБ,
         так что векторное преимущество всё равно теряется, а вес — нет.
         apple-touch-icon сделан квадратным и непрозрачным: iOS накладывает
         свою маску, и прозрачные углы стали бы на домашнем экране чёрными. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
